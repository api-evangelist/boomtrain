name: BoomTrain
description: BoomTrain was a machine-learning marketing technology startup that used AI to
  power personalized, cross-channel messaging (email, web, and push notifications) for brands,
  predicting individual content and send-time recommendations for each consumer. Backed by
  500 Global (formerly 500 Startups) among others, BoomTrain raised roughly $15M before being
  acquired by Zeta Global in July 2017 (reportedly $35-40M), which folded its machine-learning,
  decisioning, and personalization technology into the Zeta Marketing Platform. The boomtrain.com
  domain now redirects to Zeta Global; there is no standalone BoomTrain developer portal, public
  API, or documentation surface. This profile is retained as a historical company record in the
  API Evangelist network.
